plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bengkel.bonmanual'
    compileSdk 34

    defaultConfig {
        applicationId "com.bengkel.bonmanual"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("bon-release.jks")
            storePassword "bonmanual123"
            keyAlias "bonmanual"
            keyPassword "bonmanual123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
